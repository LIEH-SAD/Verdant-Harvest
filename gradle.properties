# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft
# 26.x ships unobfuscated, so neither loader needs a `mappings` dependency and
# shared sources can be compiled against vanilla and used as-is by both loaders.
minecraft_version=26.2
minecraft_version_range=[26.2]

# Mod Properties
mod_version=0.0.1
maven_group=com.verdant_harvest
mod_id=verdant_harvest
mod_name=Verdant Harvest
mod_license=MIT
mod_authors=Nanbin-Studio
mod_description=A timely snow promises a good harvest.
mod_homepage=https://lieh-sad.github.io/nanbin/

# Fabric Properties
# check these on https://fabricmc.net/develop
loom_version=1.17.20
loader_version=0.19.5
fabric_api_version=0.161.0+26.2
# Mixin library, used as a compile-only dependency of the shared :common module.
mixin_version=0.17.4+mixin.0.8.7

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
neo_version=26.2.0.88
moddev_version=2.0.148
