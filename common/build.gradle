// Shared, loader-agnostic module.
//
// It is compiled against plain vanilla Minecraft (via Loom, without mappings - 26.x
// ships unobfuscated), so nothing in here may reference a loader API. Anything the
// loaders disagree on is routed through com.verdant_harvest.platform.Platform.

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "${rootProject.name}-common"
}

dependencies {
	// 26.x ships unobfuscated, so a plain `minecraft` dependency (no `mappings`,
	// no `modImplementation`) is all that is needed.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Mixin annotations. Both loaders ship the Mixin runtime, so this is compile-only;
	// the API is the same `org.spongepowered.asm.mixin` package either way.
	compileOnly "net.fabricmc:sponge-mixin:${project.mixin_version}"

	// Loom annotates the Minecraft jar it produces with @Environment(EnvType...); this
	// compile-only dependency lets javac resolve those annotations instead of warning
	// about an unknown enum constant. No Fabric runtime API is used by :common.
	compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
