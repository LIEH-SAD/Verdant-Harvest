// Root build script: shared configuration for the common/fabric/neoforge modules.
// Loader-specific configuration lives in each module's own build.gradle.

subprojects {
	apply plugin: 'java-library'

	group = rootProject.maven_group
	version = rootProject.mod_version

	repositories {
		mavenCentral()
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
	}
}
